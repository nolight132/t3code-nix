name: update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: ./update.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: nix build .#t3code .#t3code-nightly
      - name: commit
        run: |
          git diff --quiet sources.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for channel in stable nightly; do
            old=$(git show HEAD:sources.json | jq -r --arg c "$channel" '.[$c].version // .version')
            new=$(jq -r --arg c "$channel" '.[$c].version' sources.json)
            [ "$old" = "$new" ] && continue
            changes+=("$channel to $new")
          done
          git commit -am "chore: update t3code $(IFS=,; echo "${changes[*]}" | sed 's/,/, /g')"
          git push
